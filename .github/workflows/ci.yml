name: CI Pipeline

on:
  push:
    branches: [main, cleanup-and-perf]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-sqlite-tests:
    name: Backend Lint, Type Check & SQLite Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OCR & PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint & Format Check with Ruff
        run: |
          ruff check backend evals scripts
          ruff format --check backend evals scripts

      - name: Type check with Mypy
        run: |
          mypy backend

      - name: Pre-warm Fastembed embedding model
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Run Pytest Suite (SQLite Fallback)
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

      - name: Run Ingestion Evaluation Benchmark
        run: |
          PYTHONPATH=backend python evals/ingestion_eval.py

  backend-postgres-pgvector-tests:
    name: Backend Pytest on PostgreSQL 16 + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: veridocs
          POSTGRES_PASSWORD: veridocs_test_password
          POSTGRES_DB: veridocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OCR & PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://veridocs:veridocs_test_password@localhost:5432/veridocs_test
        run: |
          alembic upgrade head

      - name: Pre-warm Fastembed embedding model
        run: |
          python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"

      - name: Run Pytest against real PostgreSQL + pgvector
        env:
          CI: "true"
          REQUIRE_POSTGRES: "true"
          DATABASE_URL: postgresql://veridocs:veridocs_test_password@localhost:5432/veridocs_test
          TEST_DATABASE_URL: postgresql://veridocs:veridocs_test_password@localhost:5432/veridocs_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v

  frontend-quality-and-build:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest frontend unit tests
        run: npm run test:frontend

      - name: Run Next.js production build
        run: npm run build
