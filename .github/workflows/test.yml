name: Full-Stack Test & Build Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        run: |
          python -m pytest --cov=backend --cov-report=term-missing

  frontend-checks:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies via lockfile
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps --legacy-peer-deps

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Vitest Unit Suite
        working-directory: ./frontend
        run: npm test

      - name: Run Next.js production build
        working-directory: ./frontend
        run: npm run build

  e2e-tests:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    needs: [frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies via lockfile
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium with system dependencies
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build Next.js production bundle
        working-directory: ./frontend
        run: npm run build

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
