services:
  - type: web
    name: veridocs-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://veridocs17.vercel.app
      - key: RATE_LIMIT_QUERY_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_UPLOAD_PER_HOUR
        value: "10"
      - key: MAX_SESSIONS_COUNT
        value: "20"
      - key: PORT
        value: "8000"

