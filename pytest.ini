[pytest]
testpaths = backend/tests
pythonpath = backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
markers =
    live_eval: Live LLM evaluation harness against real LLM and labeled benchmark
addopts = -v --tb=short -m "not live_eval"
